[metadata]
name = album-gui
version = 0.1.0
description = album plugin template for extending the album commandline features
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.com/album-app/plugins/album-gui
author = Kyle Harrington, Jan Philipp Albrecht, Deborah Schmidt
maintainer = Kyle Harrington, Jan Philipp Albrecht, Deborah Schmidt
maintainer_email = album@kyleharrington.com
license = MIT
license_file = LICENSE
platforms = any
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: Implementation :: PyPy
    Topic :: Utilities
keywords = virtual, environments, imaging, data analysis
project_urls =
    Source=https://gitlab.com/album-app/plugins/album-gui
    Tracker=https://gitlab.com/album-app/plugins/album-gui/issues

[options]
package_dir =
    =src
packages = find_namespace:
include_package_data = True
install_requires =
    album>=0.7.1
    PyQt5>=5.15.6
python_requires = >=3.7

[options.package_data]
* = *.txt, *.rst, *.sh, *.sql, *.json

[options.packages.find]
where = src

[options.entry_points]
console_parsers_album =
    gui=album.gui.commandline:create_parser
album_gui_plugins =
    string=album.gui.plugins:create_gui_string
    integer=album.gui.plugins:create_gui_integer
    float=album.gui.plugins:create_gui_float
    double=album.gui.plugins:create_gui_double
    boolean=album.gui.plugins:create_gui_boolean
    file=album.gui.plugins:create_gui_file
    directory=album.gui.plugins:create_gui_directory
